name: Travel agent demo tests

on:
  pull_request:
    paths:
      - 'travel-agent-demo/**'
      - '.github/workflows/travel-agent-demo-tests.yml'
  push:
    branches: [main, feat/opencode-travel-agent-demo]
    paths:
      - 'travel-agent-demo/**'
      - '.github/workflows/travel-agent-demo-tests.yml'

permissions:
  contents: read

concurrency:
  group: travel-demo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: travel-agent-demo
    steps:
      - uses: actions/checkout@v5
      - name: Verify committed sandbox integration sources
        run: git ls-files --error-unmatch .opencode/plugins/tracing.ts .opencode/tools/travel.ts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: travel-agent-demo/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test

  forwarder-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: travel-agent-demo/tracing-forwarder
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: travel-agent-demo/tracing-forwarder/requirements.txt
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: .

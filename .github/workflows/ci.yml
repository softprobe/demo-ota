name: demo-ota CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: demo-ota-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check uninstrumented app sources and zero Compose files
        run: node tests/check-uninstrumented-source.mjs

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Test Go downstream sandbox
        working-directory: services/ota-sandbox
        run: go test -v ./...

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test Java backend
        run: mvn -B test

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Install Node agent dependencies
        working-directory: agents/vercel-ai
        run: npm install --no-audit --no-fund

      - name: Run polyglot agent conformance suite
        run: node tests/agent-conformance/run-conformance.mjs

# Travel demo for a machine without Kubernetes.
# Prepare the pages first: docker-staging.md in this directory.
services:
  demo-airline:
    image: docker.io/softprobe/sp-airline:v2.0.3
    environment:
      SERVER_PORT: "8081"
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx768m"

  travel-ui:
    image: docker.io/softprobe/sp-ota:v2.0.3
    depends_on:
      - demo-airline
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      AIRLINE_BASE_URL: http://demo-airline:8081/airline-api/v1
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx768m"
      SPRING_WEB_RESOURCES_STATIC_LOCATIONS: "file:/opt/web/,classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/"
    volumes:
      - ./.staging-web/index.html:/opt/web/index.html:ro
      - ./.staging-web/booking.html:/opt/web/booking.html:ro
      - ./.staging-web/payment.html:/opt/web/payment.html:ro
      - ./.staging-web/orders.html:/opt/web/orders.html:ro
      - ./.staging-web/js/softprobe-session.js:/opt/web/js/softprobe-session.js:ro

  obi:
    image: otel/ebpf-instrument:v0.15.2
    pid: host
    privileged: true
    depends_on:
      - travel-ui
      - demo-airline
    environment:
      OTEL_EBPF_CONFIG_PATH: /config/obi.yml
      OTEL_EBPF_OPEN_PORT: "8080,8081"
      OTEL_EBPF_BPF_CONTEXT_PROPAGATION: headers
      OTEL_EXPORTER_OTLP_ENDPOINT: https://thelake-staging.softprobe.ai
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_HEADERS: Authorization=Bearer home-demo
    volumes:
      - ./obi-docker.yml:/config/obi.yml:ro
      - /sys/kernel/tracing:/sys/kernel/tracing
      - /sys/fs/cgroup:/sys/fs/cgroup

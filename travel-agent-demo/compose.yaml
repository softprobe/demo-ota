name: softprobe-travel-demo
services:
  demo-airline:
    image: docker.io/softprobe/sp-airline:v2.0.3
    environment:
      SERVER_PORT: "8081"
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m"
  travel-ui:
    image: docker.io/softprobe/sp-ota:v2.0.3
    depends_on: [demo-airline]
    ports: ["127.0.0.1:8080:8080"]
    environment:
      SERVER_PORT: "8080"
      AIRLINE_BASE_URL: "http://demo-airline:8081/airline-api/v1"
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m"
      SPRING_WEB_RESOURCES_STATIC_LOCATIONS: "file:/opt/web/,classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/"
    volumes:
      - ./.runtime/staging-web:/opt/web:ro
  session-stamp:
    build: ./tracing-forwarder
    user: "${LOCAL_UID:-501}:${LOCAL_GID:-20}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:4319:4319"]
    volumes:
      - ./.runtime/forwarder-token:/run/forwarder-token:ro
      - ./.runtime/softprobe.json:/run/softprobe.json:ro
  obi:
    image: otel/ebpf-instrument:v0.15.2
    pid: host
    privileged: true
    depends_on: [travel-ui, demo-airline, session-stamp]
    environment:
      OTEL_EBPF_CONFIG_PATH: "/config/obi.yml"
      OTEL_EBPF_OPEN_PORT: "8080,8081"
      OTEL_EBPF_BPF_CONTEXT_PROPAGATION: "headers"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://session-stamp:4319"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Bearer home-demo"
    volumes:
      - ./upstream/obi-docker.yml:/config/obi.yml:ro
      - /sys/kernel/tracing:/sys/kernel/tracing
      - /sys/fs/cgroup:/sys/fs/cgroup
